<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

  <meta charset="UTF-8">

  <title>Product</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/home.css}">


  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

<header class="navbar">

  <div class="logo">
    MEKO
  </div>

    <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a href="#">Khám phá</a>
        <a href="#">Câu chuyện</a>
        <a th:href="@{/voucher}">Voucher</a>
        <a th:href="@{/category}">Cate</a>
        <a th:href="@{/product}">Product</a>
    </nav>
  <div class="user-menu">

    <button class="user-btn">
      Hi, <span th:text="${username}"></span>
    </button>

    <div class="dropdown-content">

      <a href="/profile">Profile</a>

      <a href="/orders">My Orders</a>

      <form action="/logout" method="post">
        <button type="submit" class="logout-btn">
          Logout
        </button>

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
      </form>

    </div>

  </div>

</header>
<h2>Danh sách Product</h2>

<div class="container">
  <table class="table table-striped-columns">

    <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Description</th>
      <th>Price</th>
      <th>Stock</th>
      <th>Status</th>
      <th>CreateAt</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="product : ${products}">
      <td th:text="${product.id}"></td>
      <td th:text="${product.productName}"></td>
      <td th:text="${product.description}"></td>
      <td th:text="${product.price}"></td>
      <td th:text="${product.stock}"></td>
      <td th:text="${product.status}"></td>
      <td th:text="${product.createdAt}"></td>
    </tr>
    </tbody>

  </table>
</div>

<footer>

  <h3>MEKO</h3>

  <p>
    Digital Storytelling & Cultural Souvenir
  </p>

</footer>

</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
