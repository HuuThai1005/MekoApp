<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<header class="navbar">

    <div class="logo">
        MEKO
    </div>

    <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a href="#">Khám phá</a>
        <a href="#">Câu chuyện</a>
        <a th:href="@{/voucher}">Voucher</a>
        <a th:href="@{/category}">Cate</a>
        <a th:href="@{/product}">Product</a>
    </nav>
    <div th:if="${username == null}" class="user-menu">
        <a th:href="@{/login}">Login</a>
    </div>
    <div th:if="${username != null}" class="user-menu">

        <button class="user-btn">
            Hi, <span th:text="${username}"></span>
        </button>

        <div class="dropdown-content">

            <a th:href="@{/profile}">Profile</a>

            <a href="/orders">My Orders</a>

            <form action="/logout" method="post">
                <button type="submit" class="logout-btn">
                    Logout
                </button>

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">
            </form>

        </div>

    </div>

</header>
<section class="profile-page">

    <div class="profile-card">

        <!-- LEFT -->

        <div class="profile-left">

            <img src="/asset/avatar_mac_dinh.jpg"
                 alt="Avatar">

            <h2 th:text="${user.username}"></h2>

            <p th:text="${user.email}"></p>

            <a th:href="@{/profile/update}" class="edit-btn">
                Chỉnh sửa hồ sơ
            </a>

        </div>

        <!-- RIGHT -->

        <div class="profile-right">

            <h2>Thông tin cá nhân</h2>

            <div class="profile-info">

                <div class="info-group">
                    <label>Họ và tên</label>
                    <input type="text"
                           th:value="${user.username}"
                           readonly>
                </div>

                <div class="info-group">
                    <label>Email</label>
                    <input type="text"
                           th:value="${user.email}"
                           readonly>
                </div>

                <div class="info-group">
                    <label>Số điện thoại</label>
                    <input type="text"
                           th:value="${user.phone}"
                           readonly>
                </div>

            </div>

        </div>

    </div>

</section>
<footer>

    <h3>MEKO</h3>

    <p>
        Digital Storytelling & Cultural Souvenir
    </p>

</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
