<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>MEKO - Voucher</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/home.css}">

    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<header class="navbar">

    <div class="logo">
        MEKO
    </div>

    <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a href="#">Khám phá</a>
        <a href="#">Câu chuyện</a>
        <a th:href="@{/voucher}">Voucher</a>
        <a th:href="@{/category}">Cate</a>
        <a th:href="@{/product}">Product</a>
    </nav>

    <div class="user-menu">

        <button class="user-btn"
                th:if="${username != null}">
            Hi, <span th:text="${username}"></span>
        </button>

        <div class="dropdown-content">

            <a href="/profile">Profile</a>

            <a href="/orders">My Orders</a>

            <form action="/logout" method="post">

                <button type="submit" class="logout-btn">
                    Logout
                </button>

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">
            </form>

        </div>

    </div>

</header>

<section class="voucher-section">

    <h2>Voucher ưu đãi</h2>

    <div class="voucher-grid">

        <div class="voucher-card"
             th:each="voucher : ${vouchers}">

            <div class="voucher-left">

                <div class="discount">

                    <span th:if="${voucher.discountType == 'PERCENT'}"
                          th:text="${#numbers.formatDecimal(voucher.value,0,0)}">
                    </span>

                    <small th:if="${voucher.discountType == 'PERCENT'}">
                        %
                    </small>

                    <span th:if="${voucher.discountType == 'FIXED'}"
                          th:text="${voucher.value >= 1000000 ?
                          #numbers.formatDecimal(voucher.value/1000000,1,1)
                          : #numbers.formatDecimal(voucher.value/1000,0,0)}">
                    </span>

                    <small th:if="${voucher.discountType == 'FIXED'}"
                           th:text="${voucher.value >= 1000000 ? 'M' : 'K'}">
                    </small>

                </div>

            </div>

            <div class="voucher-right">

                <h3 th:text="${voucher.voucherName}"></h3>

                <p>
                    Code:
                    <strong th:text="${voucher.voucherCode}"></strong>
                </p>

                <p>
                    Số lượng còn:
                    <span th:text="${voucher.amount}"></span>
                </p>

                <span class="status"
                      th:text="${voucher.status}">
                </span>

            </div>

        </div>

    </div>

</section>

<footer>

    <h3>MEKO</h3>

    <p>
        Digital Storytelling & Cultural Souvenir
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
