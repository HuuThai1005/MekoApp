<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<header class="navbar">

  <div class="logo">
    MEKO
  </div>

  <nav>
    <a th:href="@{/}">Trang chủ</a>
    <a href="#">Khám phá</a>
    <a href="#">Câu chuyện</a>
    <a th:href="@{/voucher}">Voucher</a>
    <a th:href="@{/category}">Cate</a>
    <a th:href="@{/product}">Product</a>
  </nav>
  <div th:if="${username == null}" class="user-menu">
    <a th:href="@{/login}">Login</a>
  </div>
  <div th:if="${username != null}" class="user-menu">

    <button class="user-btn">
      Hi, <span th:text="${username}"></span>
    </button>

    <div class="dropdown-content">

      <a th:href="@{/profile}">Profile</a>

      <a href="/orders">My Orders</a>

      <form action="/logout" method="post">
        <button type="submit" class="logout-btn">
          Logout
        </button>

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
      </form>

    </div>

  </div>

</header>
<section class="profile-page">

  <div class="profile-card">

    <!-- LEFT -->

    <div class="profile-left">

      <img src="/asset/avatar_mac_dinh.jpg"
           alt="Avatar">
        <h2 th:text="${username}"></h2>

    </div>

    <!-- RIGHT -->

    <div class="profile-right">

      <h2>Thông tin cá nhân</h2>

      <div class="profile-info">

        <div class="info-group">
          <form th:action="@{/profile/edit}" method="post">

            <input type="hidden"
                   name="id"
                   th:value="${user.id}">

            <div class="info-group">
              <input type="hidden"
                     name="username"
                     th:value="${user.username}">
            </div>

            <div class="info-group">
              <label>Email</label>
              <input type="email"
                     name="email"
                     th:value="${user.email}">
            </div>

            <div class="info-group">
              <label>Phone number</label>
              <input type="text"
                     name="phone"
                     th:value="${user.phone}">
            </div>
              <div class="action-buttons">
                  <button type="submit" class="btn btn-success save-btn">
                      Save
                  </button>
                  <a th:href="@{/profile}"
                     class="cancel-btn">
                      Cancel
                  </a>
              </div>




            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">
          </form>

      </div>

    </div>
    </div>
  </div>


</section>
<footer>

  <h3>MEKO</h3>

  <p>
    Digital Storytelling & Cultural Souvenir
  </p>

</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
