<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MEKO - Cập nhật hồ sơ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>

<header class="navbar">
    <div class="logo">MEKO</div>
    <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a th:href="@{/voucher}">Voucher</a>
        <a th:href="@{/category}">Cate</a>
        <a th:href="@{/product}">Product</a>
        <a th:href="@{/cart}">Giỏ hàng</a>
    </nav>
    <div th:if="${username == null}" class="user-menu">
        <a th:href="@{/login}">Login</a>
    </div>
    <div th:if="${username != null}" class="user-menu">
        <button class="user-btn">Hi, <span th:text="${username}"></span></button>
        <div class="dropdown-content">
            <a th:href="@{/profile}">Profile</a>
            <a href="/orders">My Orders</a>
            <form action="/logout" method="post">
                <button type="submit" class="logout-btn">Logout</button>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            </form>
        </div>
    </div>
</header>

<section class="profile-page">
    <div class="profile-card">
        <div class="profile-left">
            <img src="/asset/avatar_mac_dinh.jpg" alt="Avatar">
            <h2 th:text="${username}"></h2>
        </div>

        <div class="profile-right">
            <h2>Chỉnh sửa thông tin</h2>
            <div class="profile-info">
                <form th:action="@{/profile/edit}" method="post" style="width: 100%;">
                    <input type="hidden" name="id" th:value="${user.id}">
                    <input type="hidden" name="username" th:value="${user.username}">

                    <div class="info-group">
                        <label>Email</label>
                        <input type="email" name="email" th:value="${user.email}">
                    </div>

                    <div class="info-group">
                        <label>Phone number</label>
                        <input type="text" name="phone" th:value="${user.phone}">
                    </div>

                    <div class="action-buttons">
                        <button type="submit" class="save-btn">Save</button>
                        <a th:href="@{/profile}" class="cancel-btn">Cancel</a>
                    </div>

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                </form>
            </div>
        </div>
    </div>
</section>

<footer>
    <h3>MEKO</h3>
    <p>Digital Storytelling & Cultural Souvenir</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
