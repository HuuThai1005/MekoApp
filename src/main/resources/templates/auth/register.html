<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container">

    <h2>Register</h2>

    <form th:action="@{/auth/register}" method="post">

        <input
                type="text"
                name="username"
                placeholder="Username"
                required>

        <input
                type="email"
                name="email"
                placeholder="Email"
                required>

        <input
                type="text"
                name="phone"
                placeholder="Phone">

        <input
                type="password"
                name="password"
                placeholder="Password"
                required>

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already have account?
        <a href="/login">
            Login
        </a>
    </p>

</div>

</body>
</html>
