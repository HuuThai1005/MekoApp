<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>MEKO - Đăng Ký Thành Viên</title>
    <!-- Google Fonts Premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">


</head>
<body>

<div class="auth-card">
    <div class="brand-logo">MEKO</div>
    <div class="auth-subtitle">Khởi tạo hành trình</div>

    <h2>Đăng Ký</h2>

    <!-- Giữ nguyên th:action hướng tới /auth/register của bạn -->
    <form th:action="@{/auth/register}" method="post">
        <div class="form-group">
            <input type="text" name="username" placeholder="Tên đăng nhập" required>
        </div>

        <div class="form-group">
            <input type="email" name="email" placeholder="Địa chỉ Email" required>
        </div>

        <div class="form-group">
            <input type="text" name="phone" placeholder="Số điện thoại">
        </div>

        <div class="form-group">
            <input type="password" name="password" placeholder="Mật khẩu bảo mật" required>
        </div>

        <button type="submit" class="btn-auth">
            Tạo tài khoản
        </button>
    </form>

    <p class="auth-switch">
        Đã có tài khoản thành viên?
        <a href="/login">Đăng nhập</a>
    </p>
</div>

</body>
</html>
