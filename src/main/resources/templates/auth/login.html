<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>MEKO - Đăng Nhập</title>
    <!-- Google Fonts Premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">


</head>
<body>

<div class="auth-card">
    <div class="brand-logo">MEKO</div>
    <div class="auth-subtitle">Cultural Souvenir</div>

    <h2>Đăng Nhập</h2>

    <form action="/login" method="post">
        <div class="form-group">
            <input type="text" name="username" placeholder="Tên đăng nhập" required>
        </div>

        <div class="form-group">
            <input type="password" name="password" placeholder="Mật khẩu" required>
        </div>

        <!-- Giữ nguyên token CSRF của bạn -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <button type="submit" class="btn-auth">
            Đăng Nhập
        </button>
    </form>

    <p class="auth-switch">
        Chưa có tài khoản?
        <a href="/register">Đăng ký ngay</a>
    </p>
</div>

</body>
</html>
