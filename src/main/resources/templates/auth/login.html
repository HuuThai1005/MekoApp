<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container">

    <h2>Login</h2>

    <form action="/login" method="post">

        <input
                type="text"
                name="username"
                placeholder="Username"
                required>

        <input
                type="password"
                name="password"
                placeholder="Password"
                required>
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have account?
        <a href="/register">
            Register
        </a>
    </p>

</div>

</body>
</html>
