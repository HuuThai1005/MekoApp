<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MEKO Admin - Tạo Danh Mục</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="admin-wrapper">
    <aside class="admin-sidebar">
        <div class="sidebar-logo">MEKO ADMIN</div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/dashboard}">🏠 Thống Kê Chung</a></li>
            <li><a th:href="@{/category}">📁 Quản Lý Danh Mục</a></li>
            <li><a th:href="@{/dashboard/product}">🛍 Quản Lý Sản Phẩm</a></li>
            <li><a th:href="@{/dashboard/voucher}">🎟 Quản Lý Vouchers</a></li>
<!--            <li><a th:href="@{/profile}">👤 Tài Khoản</a></li>-->
        </ul>
    </aside>
    <main class="admin-main">
        <div class="admin-header">
            <h2>Tạo Danh Mục Mới</h2>
            <a th:href="@{/category}" class="btn-adm btn-adm-secondary">← Trở Lại</a>
        </div>
        <div class="admin-form-card">
            <form th:action="@{/category/create}" method="post">
                <input type="hidden" name="id">
                <div class="form-field">
                    <label>Tên Danh Mục</label>
                    <input type="text" name="categoryName" placeholder="Ví dụ: Đồ Gốm Nghệ Thuật" required>
                </div>
                <div class="form-field">
                    <label>Mô Tả Chi Tiết</label>
                    <input type="text" name="description" placeholder="Nhập tóm tắt mô tả về danh mục...">
                </div>
                <div class="btn-group-actions">
                    <a th:href="@{/category}" class="btn-adm btn-adm-secondary">Hủy bỏ</a>
                    <button type="submit" class="btn-adm btn-adm-primary">Lưu Danh Mục</button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
