<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MEKO Admin - Cập Nhật Sản Phẩm</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="admin-wrapper">
    <aside class="admin-sidebar">
        <div class="sidebar-logo">MEKO ADMIN</div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/dashboard}">🏠 Thống Kê Chung</a></li>
            <li><a th:href="@{/category}">📁 Quản Lý Danh Mục</a></li>
            <li><a th:href="@{/dashboard/product}">🛍 Quản Lý Sản Phẩm</a></li>
            <li><a th:href="@{/dashboard/voucher}">🎟 Quản Lý Vouchers</a></li>
<!--            <li><a th:href="@{/profile}">👤 Tài Khoản</a></li>-->
        </ul>
    </aside>
    <main class="admin-main">
        <div class="admin-header">
            <h2>Chỉnh Sửa Thông Tin Sản Phẩm</h2>
            <a th:href="@{/dashboard/product}" class="btn-adm btn-adm-secondary">← Danh Sách</a>
        </div>
        <div class="admin-form-card">
            <form th:action="@{/dashboard/product/update/{id}(id=${product.id})}" method="post">
                <div class="form-grid-2">
                    <div class="form-field">
                        <label>Tên Sản Phẩm</label>
                        <input type="text" name="productName" th:value="${product.productName}" required>
                    </div>
                    <div class="form-field">
                        <label>Loại Sản Phẩm</label>
                        <select name="category.id">
                            <option value="1" th:selected="${product.category.id == 1}">Móc khóa</option>
                            <option value="2" th:selected="${product.category.id == 2}">Magnet tủ lạnh</option>
                        </select>
                    </div>
                </div>

                <div class="form-field">
                    <label>Mô Tả</label>
                    <input type="text" name="description" th:value="${product.description}">
                </div>

                <div class="form-grid-2">
                    <div class="form-field">
                        <label>Giá Bán (VNĐ)</label>
                        <input type="number" name="price" th:value="${product.price}" required>
                    </div>
                    <div class="form-field">
                        <label>Số Lượng</label>
                        <input type="number" name="stock" th:value="${product.stock}" required>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-field">
                        <label>Hình Ảnh</label>
                        <select name="imageUrl">
                            <option value="/asset/cay_lua.jpg" th:selected="${product.imageUrl == '/asset/cay_lua.jpg'}">Cây lúa</option>
                            <option value="/asset/cau_can_tho.jpg" th:selected="${product.imageUrl == '/asset/cau_can_tho.jpg'}">Cầu Cần Thơ</option>
                            <option value="/asset/cho_noi_cai_rang.jpg" th:selected="${product.imageUrl == '/asset/cho_noi_cai_rang.jpg'}">Chợ nổi Cái Răng</option>
                            <option value="/asset/chua_khmer.jpg" th:selected="${product.imageUrl == '/asset/chua_khmer.jpg'}">Chùa Khmer</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label>Trạng Thái Kinh Doanh</label>
                        <select name="status">
                            <option value="active" th:selected="${product.status == 'active'}">ĐANG BÁN (ACTIVE)</option>
                            <option value="unactive" th:selected="${product.status == 'unactive'}">TẠM DỪNG (UNACTIVE)</option>
                        </select>
                    </div>
                </div>

                <input type="hidden" name="createdAt" th:value="${product.createdAt}">

                <div class="btn-group-actions">
                    <a th:href="@{/dashboard/product}" class="btn-adm btn-adm-secondary">Hủy</a>
                    <button type="submit" class="btn-adm btn-adm-primary">💾 Cập Nhật</button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
