<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>MEKO</title>

    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/voucher.css}">

    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<section class="">

    <!-- Header -->
    <div class="page-header">

        <h2>Tạo Voucher</h2>

        <a th:href="@{/voucher}"
           class="btn-back">

            ← Quay lại

        </a>

    </div>

    <!-- Form -->
    <div class="form-card">

        <form th:action="@{/voucher/create}"
              method="post">

            <div class="form-group">

                <label>Mã Voucher</label>

                <input type="text"
                       name="voucherCode"
                       placeholder="Nhập mã voucher">

            </div>

            <div class="form-group">

                <label>Tên Voucher</label>

                <input type="text"
                       name="voucherName"
                       placeholder="Nhập tên voucher">

            </div>

            <div class="form-group">

                <label>Loại giảm</label>

                <select name="discountType">

                    <option value="PERCENT">
                        Phần trăm
                    </option>

                    <option value="FIXED">
                        Tiền mặt
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>Giá trị</label>

                <input type="number"
                       name="value"
                       placeholder="Nhập giá trị">

            </div>

            <div class="form-group">

                <label>Số lượng</label>

                <input type="number"
                       name="amount"
                       placeholder="Nhập số lượng">

            </div>

            <div class="form-group">

                <label>Ngày bắt đầu</label>

                <input type="datetime-local"
                       name="startDate">

            </div>

            <div class="form-group">

                <label>Ngày kết thúc</label>

                <input type="datetime-local"
                       name="endDate">

            </div>

            <input type="hidden"
                   name="status"
                   value="ACTIVE">

            <div class="form-actions">

                <a th:href="@{/dashboard/voucher}"
                   class="btn-cancel">

                    Hủy

                </a>

                <button type="submit"
                        class="btn-save">

                    Lưu Voucher

                </button>

            </div>

        </form>

    </div>

</section>

</body>
</html>
