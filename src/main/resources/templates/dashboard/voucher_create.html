<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MEKO Admin - Tạo Voucher</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="admin-wrapper">
    <aside class="admin-sidebar">
        <div class="sidebar-logo">MEKO ADMIN</div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/dashboard}">🏠 Thống Kê Chung</a></li>
            <li><a th:href="@{/category}">📁 Quản Lý Danh Mục</a></li>
            <li><a th:href="@{/dashboard/product}">🛍 Quản Lý Sản Phẩm</a></li>
            <li><a th:href="@{/dashboard/voucher}">🎟 Quản Lý Vouchers</a></li>
<!--            <li><a th:href="@{/profile}">👤 Tài Khoản</a></li>-->
        </ul>
    </aside>
    <main class="admin-main">
        <div class="admin-header">
            <h2>Phát Hành Khuyến Mãi Mới</h2>
            <a th:href="@{/dashboard/voucher}" class="btn-adm btn-adm-secondary">← Trở Lại</a>
        </div>
        <div class="admin-form-card">
            <form th:action="@{/dashboard/voucher/create}" method="post">
                <div class="form-grid-2">
                    <div class="form-field">
                        <label>Mã Cấu Hình Voucher</label>
                        <input type="text" name="voucherCode" placeholder="Ví dụ: MEKOMOI2026" required>
                    </div>
                    <div class="form-field">
                        <label>Tên Chương Trình</label>
                        <input type="text" name="voucherName" placeholder="Ví dụ: Giảm giá hè" required>
                    </div>
                </div>

                <div class="form-grid-3" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem;">
                    <div class="form-field">
                        <label>Loại Giảm Giá</label>
                        <select name="discountType">
                            <option value="PERCENT">Phần trăm (%)</option>
                            <option value="FIXED">Tiền mặt (VNĐ)</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label>Giá Trị Giảm</label>
                        <input type="number" name="value" placeholder="Ví dụ: 10 hoặc 50000" required>
                    </div>
                    <div class="form-field">
                        <label>Số Lượng Phát Hành</label>
                        <input type="number" name="amount" placeholder="Số lượng phát hành..." required>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-field">
                        <label>Ngày Bắt Đầu hiệu lực</label>
                        <input type="datetime-local" name="startDate" required>
                    </div>
                    <div class="form-field">
                        <label>Ngày Hết Hạn</label>
                        <input type="datetime-local" name="endDate" required>
                    </div>
                </div>

                <input type="hidden" name="status" value="ACTIVE">

                <div class="btn-group-actions">
                    <a th:href="@{/dashboard/voucher}" class="btn-adm btn-adm-secondary">Hủy bỏ</a>
                    <button type="submit" class="btn-adm btn-adm-primary">Kích Hoạt Phát Hành</button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
