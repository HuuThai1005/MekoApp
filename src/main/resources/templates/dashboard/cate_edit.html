<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>MEKO</title>

    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/voucher.css}">

    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<section class="">

    <!-- Header -->
    <div class="page-header">

        <h2>Tạo cate</h2>

        <a th:href="@{/category}"
           class="btn-back">

            ← Quay lại

        </a>

    </div>

    <!-- Form -->
    <div class="form-card">
        <!-- gửi path voucher lên để controller hứng-->
        <form th:action="@{/category/update/{id}(id=${category.id})}"
              method="post">
            <input type="hidden"
                   name="id">

            <div class="form-group">

                <label>Tên cate</label>

                <input type="text"
                       name="categoryName"
                       th:value="${category.categoryName}">

            </div>

            <div class="form-group">

                <label>description</label>

                <input type="text"
                       name="description"
                       th:value="${category.description}">

            </div>


            <div class="form-actions">

                <a th:href="@{/dashboard/category}"
                   class="btn-cancel">

                    Hủy

                </a>

                <button type="submit"
                        class="btn-save">

                    Lưu cate

                </button>

            </div>

        </form>

    </div>

</section>

</body>
</html>
