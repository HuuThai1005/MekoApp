<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MEKO Admin - Sửa Voucher</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="admin-wrapper">
    <aside class="admin-sidebar">
        <div class="sidebar-logo">MEKO ADMIN</div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/dashboard}">🏠 Thống Kê Chung</a></li>
            <li><a th:href="@{/category}">📁 Quản Lý Danh Mục</a></li>
            <li><a th:href="@{/dashboard/product}">🛍 Quản Lý Sản Phẩm</a></li>
            <li><a th:href="@{/dashboard/voucher}">🎟 Quản Lý Vouchers</a></li>
<!--            <li><a th:href="@{/profile}">👤 Tài Khoản</a></li>-->
        </ul>
    </aside>
    <main class="admin-main">
        <div class="admin-header">
            <h2>Cập Nhật Cấu Hình Voucher</h2>
            <a th:href="@{/dashboard/voucher}" class="btn-adm btn-adm-secondary">← Danh Sách</a>
        </div>
        <div class="admin-form-card">
            <form th:action="@{/dashboard/voucher/update/{id}(id=${voucher.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="status" value="ACTIVE">

                <div class="form-grid-2">
                    <div class="form-field">
                        <label>Mã Voucher</label>
                        <input type="text" name="voucherCode" th:value="${voucher.voucherCode}" required>
                    </div>
                    <div class="form-field">
                        <label>Tên Voucher</label>
                        <input type="text" name="voucherName" th:value="${voucher.voucherName}" required>
                    </div>
                </div>

                <div class="form-grid-3" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem;">
                    <div class="form-field">
                        <label>Loại Giảm giá</label>
                        <select name="discountType">
                            <option value="PERCENT" th:selected="${voucher.discountType == 'PERCENT'}">Phần trăm</option>
                            <option value="FIXED" th:selected="${voucher.discountType == 'FIXED'}">Tiền mặt</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label>Giá Trị Giảm</label>
                        <input type="number" name="value" th:value="${voucher.value}" required>
                    </div>
                    <div class="form-field">
                        <label>Số Lượng Mã</label>
                        <input type="number" name="amount" th:value="${voucher.amount}" required>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-field">
                        <label>Ngày Bắt Đầu</label>
                        <input type="datetime-local" name="startDate" th:value="${#temporals.format(voucher.startDate, 'yyyy-MM-dd''T''HH:mm')}" required>
                    </div>
                    <div class="form-field">
                        <label>Ngày Kết Thúc</label>
                        <input type="datetime-local" name="endDate" th:value="${#temporals.format(voucher.endDate, 'yyyy-MM-dd''T''HH:mm')}" required>
                    </div>
                </div>

                <div class="btn-group-actions">
                    <a th:href="@{/dashboard/voucher}" class="btn-adm btn-adm-secondary">Hủy</a>
                    <button type="submit" class="btn-adm btn-adm-primary">💾 Lưu Thay Đổi</button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
