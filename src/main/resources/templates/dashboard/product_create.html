<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MEKO Admin - Thêm Sản Phẩm</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="admin-wrapper">
    <aside class="admin-sidebar">
        <div class="sidebar-logo">MEKO ADMIN</div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/dashboard}">🏠 Thống Kê Chung</a></li>
            <li><a th:href="@{/category}">📁 Quản Lý Danh Mục</a></li>
            <li><a th:href="@{/dashboard/product}">🛍 Quản Lý Sản Phẩm</a></li>
            <li><a th:href="@{/dashboard/voucher}">🎟 Quản Lý Vouchers</a></li>
<!--            <li><a th:href="@{/profile}">👤 Tài Khoản</a></li>-->
        </ul>
    </aside>
    <main class="admin-main">
        <div class="admin-header">
            <h2>Tạo Mới Kỷ Vật Sản Phẩm</h2>
            <a th:href="@{/dashboard/product}" class="btn-adm btn-adm-secondary">← Trở Lại</a>
        </div>
        <div class="admin-form-card">
            <form th:action="@{/dashboard/product/create}" method="post">
                <input type="hidden" name="id">

                <div class="form-grid-2">
                    <div class="form-field">
                        <label>Tên Sản Phẩm</label>
                        <input type="text" name="productName" placeholder="Nhập tên sản phẩm..." required>
                    </div>
                    <div class="form-field">
                        <label>Phân Loại Danh Mục</label>
                        <select name="category.id" required>
                            <option value="" disabled selected>-- Chọn danh mục --</option>
                            <option th:each="cate : ${categories}" th:value="${cate.id}" th:text="${cate.categoryName}"></option>
                        </select>
                    </div>
                </div>

                <div class="form-field">
                    <label>Mô Tả Sản Phẩm</label>
                    <input type="text" name="description" placeholder="Nhập câu chuyện cốt lõi hoặc thông số sản phẩm...">
                </div>

                <div class="form-grid-2">
                    <div class="form-field">
                        <label>Giá Bán (VNĐ)</label>
                        <input type="number" name="price" placeholder="Ví dụ: 150000" required>
                    </div>
                    <div class="form-field">
                        <label>Số Lượng Nhập Kho</label>
                        <input type="number" name="stock" placeholder="Ví dụ: 50" required>
                    </div>
                </div>

                <div class="form-field">
                    <label>Hình Ảnh Minh Họa</label>
                    <select name="imageUrl">
                        <option value="/asset/cay_lua.jpg">Cây lúa miền Tây</option>
                        <option value="/asset/cau_can_tho.jpg">Cầu Cần Thơ</option>
                        <option value="/asset/cho_noi_cai_rang.jpg">Chợ nổi Cái Răng</option>
                        <option value="/asset/chua_khmer.jpg">Chùa Khmer Nam Bộ</option>
                    </select>
                </div>

                <input type="hidden" name="status" value="active">
                <input type="hidden" name="createAt">

                <div class="btn-group-actions">
                    <a th:href="@{/dashboard/product}" class="btn-adm btn-adm-secondary">Hủy bỏ</a>
                    <button type="submit" class="btn-adm btn-adm-primary">Xác Nhận Lưu</button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
